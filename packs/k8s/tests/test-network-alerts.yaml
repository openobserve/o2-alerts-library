---
apiVersion: v1
kind: Namespace
metadata:
  name: alert-test

# ============================================================
# TEST 1: service_no_ready_endpoints
# A Service whose selector matches no running pods, so all
# endpoints stay not-ready. Alert fires within ~2 minutes.
# ============================================================
---
apiVersion: v1
kind: Service
metadata:
  name: test-no-endpoints
  namespace: alert-test
spec:
  selector:
    app: this-app-does-not-exist
  ports:
  - port: 80
    targetPort: 8080

---
# A Deployment where pods always fail the readiness probe.
# Pods exist and are registered as endpoints, but none are ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-not-ready-endpoints
  namespace: alert-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-not-ready-svc
  template:
    metadata:
      labels:
        app: test-not-ready-svc
    spec:
      containers:
      - name: app
        image: busybox
        command: ["sleep", "3600"]
        readinessProbe:
          httpGet:
            path: /ready
            port: 9999
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "5m"
            memory: "8Mi"
          limits:
            cpu: "20m"
            memory: "16Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: test-not-ready-svc
  namespace: alert-test
spec:
  selector:
    app: test-not-ready-svc
  ports:
  - port: 80
    targetPort: 9999

# ============================================================
# TEST 2: dns_resolution_failures_high + dns_high_latency
#
# Generate DNS failures by querying non-existent domains.
# Also generates load to push latency up.
# Runs for 10 minutes then stops.
# ============================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: test-dns-load
  namespace: alert-test
spec:
  template:
    spec:
      containers:
      - name: dns-tester
        image: busybox
        command:
        - sh
        - -c
        - |
          echo "Generating DNS failures and load for 10 minutes..."
          END=$(($(date +%s) + 600))
          while [ $(date +%s) -lt $END ]; do
            # These will return NXDOMAIN (DNS failure)
            nslookup this-domain-does-not-exist.invalid > /dev/null 2>&1 &
            nslookup another-fake-domain-xyz123.invalid > /dev/null 2>&1 &
            # These generate load (valid queries)
            nslookup kubernetes.default.svc.cluster.local > /dev/null 2>&1 &
            sleep 0.5
          done
          echo "Done."
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
      restartPolicy: Never
  backoffLimit: 1

# ============================================================
# TEST 3: node_network_errors_high
#
# Hard to trigger synthetically without raw socket access.
# Network errors occur at the kernel NIC level.
# Verify the metric is being collected with:
#
#   kubectl exec -n alert-test <any-pod> -- cat /proc/net/dev
#
# To test the alert threshold logic, temporarily lower the
# threshold in OpenObserve to 0.01 (near zero) and verify
# the alert fires on normal background noise, then restore.
# ============================================================
