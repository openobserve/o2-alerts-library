---
apiVersion: v1
kind: Namespace
metadata:
  name: alert-test

# ============================================================
# TEST 1: controller_workqueue_depth_high
#
# Creates 200 ConfigMaps in rapid succession. The controller
# manager queues all of them for processing, temporarily
# pushing workqueue_depth above the threshold (50).
#
# Deploy with:
#   kubectl apply -f test-controlplane-alerts.yaml
#
# Then trigger the bulk creation:
#   kubectl apply -f - <<EOF
#   (see bulk-configmaps Job below)
#   EOF
# ============================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-test-sa
  namespace: alert-test

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-test-role
  namespace: alert-test
rules:
- apiGroups: [""]
  resources: ["configmaps", "pods"]
  verbs: ["create", "delete", "list", "get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "delete", "list", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-test-rb
  namespace: alert-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alert-test-role
subjects:
- kind: ServiceAccount
  name: alert-test-sa
  namespace: alert-test

---
# Rapidly creates 200 ConfigMaps → spikes workqueue_depth
apiVersion: batch/v1
kind: Job
metadata:
  name: test-workqueue-spike
  namespace: alert-test
spec:
  template:
    spec:
      serviceAccountName: alert-test-sa
      containers:
      - name: bulk-creator
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Creating 200 ConfigMaps rapidly to spike workqueue depth..."
          for i in $(seq 1 200); do
            kubectl create configmap test-cm-$i \
              --from-literal=key=value-$i \
              -n alert-test > /dev/null 2>&1 &
          done
          wait
          echo "Done. Sleeping 60s then cleaning up..."
          sleep 60
          for i in $(seq 1 200); do
            kubectl delete configmap test-cm-$i -n alert-test > /dev/null 2>&1 &
          done
          wait
          echo "Cleanup complete."
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      restartPolicy: Never
  backoffLimit: 1

# ============================================================
# TEST 2: apiserver_inflight_requests_high
#         apiserver_error_rate_high (lower threshold to test)
#
# Sends 50 concurrent API list requests every second for
# 3 minutes. Pushes inflight request count up.
#
# For apiserver_error_rate_high: the threshold (1/s) is hard
# to trigger with synthetic 5xx. Instead:
#   1. Lower threshold to 0.01 in OpenObserve temporarily
#   2. Run this job — background errors will trigger it
#   3. Restore threshold to 1 after verification
# ============================================================
---
apiVersion: batch/v1
kind: Job
metadata:
  name: test-apiserver-load
  namespace: alert-test
spec:
  template:
    spec:
      serviceAccountName: alert-test-sa
      containers:
      - name: api-load
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Sending concurrent API requests for 3 minutes..."
          END=$(($(date +%s) + 180))
          while [ $(date +%s) -lt $END ]; do
            for i in $(seq 1 20); do
              kubectl get pods -n alert-test > /dev/null 2>&1 &
              kubectl get configmaps -n alert-test > /dev/null 2>&1 &
              kubectl get services --all-namespaces > /dev/null 2>&1 &
            done
            sleep 0.2
          done
          wait
          echo "Done."
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "128Mi"
      restartPolicy: Never
  backoffLimit: 1

# ============================================================
# TEST 3: admission_webhook_failures_high
#
# Deploys a ValidatingWebhookConfiguration pointing to a
# non-existent service with failurePolicy: Fail.
# Every pod creation attempt in the test namespace will
# fail the webhook → increments rejected counter.
#
# After applying, try creating any pod in alert-test:
#   kubectl run test-pod --image=busybox -n alert-test
# → Should be rejected by webhook → metric fires
#
# CLEANUP (important — remove before other tests):
#   kubectl delete validatingwebhookconfiguration test-rejecting-webhook
# ============================================================
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: test-rejecting-webhook
webhooks:
- name: test.alert-test.svc
  admissionReviewVersions: ["v1"]
  clientConfig:
    service:
      name: non-existent-webhook-svc
      namespace: alert-test
      port: 443
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["pods"]
    scope: "Namespaced"
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: alert-test
  failurePolicy: Fail
  sideEffects: None
  timeoutSeconds: 3

# ============================================================
# TEST 4: controller_reconcile_errors_high
#
# Hard to trigger without a broken operator/controller.
# To verify the alert works:
#   1. Lower threshold to 0.001 in OpenObserve temporarily
#   2. Background reconcile noise from operators will trigger
#   3. Restore to 0.1 after verification
#
# Alternatively — check current reconcile error rate with:
#   PromQL: rate(controller_runtime_reconcile_errors_total[5m])
# ============================================================
