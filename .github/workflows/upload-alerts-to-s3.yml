name: Upload Alerts to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      s3_bucket:
        description: 'S3 bucket name (optional, overrides default)'
        required: false
        type: string

env:
  S3_BUCKET: ${{ inputs.s3_bucket || secrets.AWS_S3_BUCKET || 'openobserve-datasources-bucket' }}
  S3_PATH: 'alerts/'
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  upload-to-s3:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # bot-commits the regenerated manifest
      id-token: write  # Required for OIDC authentication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The manifest is 100% CI-built and committed, so the S3 mirror serves
      # exactly what GitHub holds. Generation is deterministic (same tree in,
      # byte-identical manifest out) — that is what makes the no-diff guard
      # below a safe loop-breaker.
      - name: Regenerate manifest
        run: python3 scripts/generate_manifest.py

      - name: Commit manifest if changed
        run: |
          if [ -z "$(git status --porcelain manifest.json)" ]; then
            echo "Manifest unchanged — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            # [skip ci] stops this push from retriggering the workflow; the
            # sync below runs in THIS run, after the commit, so S3 still gets
            # the fresh manifest atomically with the alert files.
            git commit -m "chore: regenerate manifest.json [skip ci]"
            git push
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: "arn:aws:iam::325553860333:role/github-actions-s3-uploader"
          role-session-name: GitHubActions-S3Upload
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync alerts to S3
        run: |
          # S3 is a byte-for-byte mirror of the repo: only VCS/CI internals are
          # excluded. Content of every kind (alerts, docs, tests) syncs as-is —
          # the manifest is the index consumers read, not the bucket listing.
          echo "Mirroring repo to s3://${S3_BUCKET}/${S3_PATH}"
          aws s3 sync . "s3://${S3_BUCKET}/${S3_PATH}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore"

      - name: Verify upload
        run: |
          echo "Listing uploaded files in S3:"
          aws s3 ls "s3://${S3_BUCKET}/${S3_PATH}" --recursive --summarize | tail -n 20

      - name: Upload summary
        run: |
          echo "### S3 Upload Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Bucket:** s3://${S3_BUCKET}/${S3_PATH}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${AWS_REGION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TOTAL_FILES=$(aws s3 ls "s3://${S3_BUCKET}/${S3_PATH}" --recursive | wc -l)
          TOTAL_SIZE=$(aws s3 ls "s3://${S3_BUCKET}/${S3_PATH}" --recursive --summarize | grep "Total Size" | awk '{print $3, $4}')
          echo "**Total Files:** ${TOTAL_FILES}" >> $GITHUB_STEP_SUMMARY
          echo "**Total Size:** ${TOTAL_SIZE}" >> $GITHUB_STEP_SUMMARY
